<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BM_ENGINE</title>

    <style>
        body {
            background: #0f172a;
            color: #fff;
            font-family: Arial;
            text-align: center;
            margin: 0;
            padding: 0 15px 30px;
        }

        header {
            background: #111827;
            padding: 25px;
            border-bottom: 2px solid #38bdf8;
        }

        h1 {
            font-size: 38px;
            margin: 0;
        }

        h1 span {
            color: #38bdf8;
        }

        .box {
            background: #1e293b;
            margin: 20px 0;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #334155;
        }

        .card {
            background: #1e293b;
            margin: 20px 0;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #334155;
        }

        .price {
            color: #38bdf8;
            font-size: 24px;
            font-weight: bold;
            margin: 10px;
        }

        .btn {
            display: block;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            margin: 10px 0;
            border: none;
            width: 100%;
            font-size: 16px;
            font-family: Arial;
            cursor: pointer;
            color: #fff;
        }

        .btn-whatsapp {
            background: #25D366;
        }

        .btn-telegram {
            background: #0088cc;
        }
    </style>
</head>

<body>

    <header>
        <h1>
            BM_<span>ENGINE</span>
        </h1>
        <p>متجرك الرسمي - جودة - سرعة - ثقة</p>
    </header>

    <div class="box">
        <h2>🔥 متوفر عندنا 🔥</h2>
        <p>كورس صنع ملفات ببجي</p>
        <p>ملفات مدفوعة</p>
        <p>ملفات مدفوعة بحقوقك</p>
    </div>

    <!-- المنتج 1 : الكورس -->
    <div class="card">
        <div style="font-size: 50px;">🎓</div>
        <h3>كورس صنع ملفات ببجي</h3>
        <div class="price">350 جنيه</div>

        <button class="btn btn-whatsapp" onclick="goWhatsapp('كورس صنع ملفات ببجي', '350 جنيه')">
            اطلب واتساب ✅
        </button>

        <button class="btn btn-telegram" onclick="goTelegram('كورس صنع ملفات ببجي', '350 جنيه')">
            اطلب تليجرام ✈️
        </button>
    </div>

    <!-- المنتج 2 : ملفات مدفوعة -->
    <div class="card">
        <div style="font-size: 50px;">📁</div>
        <h3>ملفات مدفوعة (عروض)</h3>
        <div class="price">200 جنيه</div>

        <button class="btn btn-whatsapp" onclick="goWhatsapp('ملفات مدفوعة (عروض)', '200 جنيه')">
            اطلب واتساب ✅
        </button>

        <button class="btn btn-telegram" onclick="goTelegram('ملفات مدفوعة (عروض)', '200 جنيه')">
            اطلب تليجرام ✈️
        </button>
    </div>

    <!-- المنتج 3 : بحقوقك -->
    <div class="card">
        <div style="font-size: 50px;">💎</div>
        <h3>ملفات مدفوعة بحقوقك</h3>
        <div class="price">200 جنيه</div>

        <button class="btn btn-whatsapp" onclick="goWhatsapp('ملفات مدفوعة بحقوقك', '200 جنيه')">
            اطلب واتساب ✅
        </button>

        <button class="btn btn-telegram" onclick="goTelegram('ملفات مدفوعة بحقوقك', '200 جنيه')">
            اطلب تليجرام ✈️
        </button>
    </div>

    <p>تليجرام: @lib4X</p>
    <p>© 2026 BM_ENGINE</p>

    <script>

        function makeMessage(productName, productPrice) {
            return "طلب جديد من BM_ENGINE" + "\n"
                + "الاسم: " + "\n"
                + "الموبايل: " + "\n"
                + "- " + productName + " : " + productPrice + "\n"
                + "الإجمالي: " + productPrice;
        }

        function goWhatsapp(productName, productPrice) {
            var message = makeMessage(productName, productPrice);
            var link = "https://wa.me/201286473176?text=" + encodeURIComponent(message);
            window.open(link, "_blank");
        }

        function goTelegram(productName, productPrice) {
            var message = makeMessage(productName, productPrice);
            var link = "https://t.me/lib4X?text=" + encodeURIComponent(message);
            window.open(link, "_blank");
        }

    </script>

</body>
</html>
