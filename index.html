<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BM_ENGINE | متجرك الرسمي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box; margin:0; padding:0;}
body{
    font-family: 'Cairo', sans-serif;
    background: #0f172a;
    color: #fff;
    padding-bottom: 350px;
    background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 50%);
}

/* الهيدر */
header{
    background: #111827; /* لون صلب بدون شفافية */
    border-bottom: 2px solid #38bdf8;
    padding: 25px 20px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); /* ظل خفيف */
    position: sticky;
    top: 0;
    z-index: 100;
}
header h1{font-size: 40px; margin: 0; letter-spacing: 2px; font-weight: 900;}
header h1 span{color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);}
header p{color: #94a3b8; margin-top: 8px; font-size: 15px;}

/* قسم الهيرو */
.hero{
    background: #1e293b;
    padding: 30px 20px;
    margin: 25px 15px;
    border-radius: 20px;
    border: 1px solid #334155;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}
.hero h2{color: #38bdf8; font-size: 28px; margin-bottom: 15px;}
.hero p{font-size: 18px; margin: 8px 0; color: #e2e8f0; font-weight: 700;}

/* المنتجات */
.products{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
    padding: 20px 15px;
    max-width: 1100px;
    margin: auto;
}
.card{
    background: #1e293b; /* لون صلب ومريح */
    padding: 15px;
    border-radius: 20px;
    text-align: center;
    border: 1px solid #334155;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}
.card:hover{
    border-color: #38bdf8; 
    transform: translateY(-5px); 
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
}

/* صورة المنتج - ده بس اللي اتغير */
.card-img{
    width: 100%;
    height: 180px;
    border-radius: 12px;
    margin-bottom: 15px;
    border: 1px solid #334155;
    background: linear-gradient(135deg, #0f172a, #1e3a8a, #0ea5e9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.card-img .icon{
    font-size: 55px;
}
.card-img .label{
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}
.card-img .sub{
    font-size: 13px;
    background: #38bdf8;
    color: #0f172a;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 900;
}

.card h3{font-size: 20px; margin-bottom: 10px; color: #fff; min-height: 50px; display: flex; align-items: center; justify-content: center;}
.price{
    color: #38bdf8; 
    font-weight: 900; 
    font-size: 26px; 
    margin-bottom: 15px;
}

/* الأزرار */
button{
    background: linear-gradient(135deg, #0ea5e9, #3b82f6);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
    font-size: 16px;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    transition: all 0.2s ease;
}
button:hover{
    background: linear-gradient(135deg, #3b82f6, #0ea5e9); 
    transform: scale(1.02);
}

/* السلة */
#cart{
    position: fixed;
    bottom: 10px;
    left: 10px;
    right: 10px;
    background: #111827; /* لون صلب */
    color: #fff;
    padding: 20px;
    border-radius: 20px;
    border: 1px solid #38bdf8;
    box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
    max-height: 330px;
    overflow-y: auto;
    z-index: 1000;
}
#cart h3{font-size: 18px; margin-bottom: 15px; text-align: center; color: #e2e8f0;}
#cart h3 span{color: #38bdf8; font-weight: 900;}

#items{
    margin-bottom: 10px;
    max-height: 100px;
    overflow-y: auto;
}
#items div{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 14px;
    border-bottom: 1px solid #334155;
    padding-bottom: 8px;
    color: #cbd5e1;
}

/* المدخلات */
input{
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    background: #0f172a;
    border: 1px solid #334155;
    color: #fff;
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Cairo', sans-serif;
}
input:focus{outline: none; border-color: #38bdf8;}
input::placeholder{color: #64748b;}

/* زرار الحذف */
.remove{
    background: #334155;
    color: #ef4444;
    width: auto;
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 6px;
    border: 1px solid #ef4444;
}
.remove:hover{background: #ef4444; color: #fff;}

/* أزرار التواصل */
.contact-btns{
    display: flex;
    gap: 10px;
    margin-top: 10px;
}
.btn-wa{
    background: #25D366 !important;
}
.btn-tg{
    background: #0088cc !important;
}

footer{
    text-align: center;
    padding: 40px 20px;
    color: #475569;
    font-size: 14px;
}
</style>
</head>
<body>

<header>
<h1>BM_<span>ENGINE</span></h1>
<p>متجرك الرسمي - جودة - سرعة - ثقة</p>
</header>

<div class="hero">
<h2>🔥 متوفر عندنا 🔥</h2>
<p>كورس صنع ملفات ببجي</p>
<p>ملفات مدفوعة</p>
<p>ملفات مدفوعة بحقوقك</p>
</div>

<div class="products" id="products"></div>

<div id="cart">
<h3>🛒 السلة: <span id="count">0</span> - الإجمالي: <span id="total">0</span> جنيه</h3>
<div id="items"></div>
<input id="name" placeholder="اسمك">
<input id="phone" placeholder="رقم موبايلك">
<div class="contact-btns">
    <button onclick="orderWhatsApp()" class="btn-wa">واتساب ✅</button>
    <button onclick="orderTelegram()" class="btn-tg">تليجرام ✈️</button>
</div>
<p style="text-align:center; color:#94a3b8; font-size:14px; margin-top: 10px;">تليجرام: @BM_ENGINE</p>
</div>

<footer>© 2026 BM_ENGINE - جميع الحقوق محفوظة</footer>

<script>
const products = [
 {
   name:"كورس صنع ملفات ببجي", 
   price:350, 
   icon:"🎓",
   label:"الكورسات المدفوعة",
   tag:"كورس مدفوع"
 },
 {
   name:"ملفات مدفوعة (عروض)", 
   price:200, 
   icon:"📁",
   label:"الملفات المدفوعة",
   tag:"ملف مدفوع"
 },
 {
   name:"ملفات مدفوعة بحقوقك", 
   price:200, 
   icon:"💎",
   label:"الملفات المدفوعة",
   tag:"بحقوقك"
 },
];

// حط يوزر التليجرام بتاعك هنا (من غير @)
const telegramUsername = "BM_ENGINE"; 
// حط رقم الواتساب بتاعك هنا
const whatsappNumber = "201286473176"; 

let cart = [];
const box = document.getElementById('products');

products.forEach((p,i)=>{
 box.innerHTML += `<div class="card">
  <div class="card-img">
    <div class="icon">${p.icon}</div>
    <div class="label">${p.label}</div>
    <div class="sub">${p.tag}</div>
  </div>
  <h3>${p.name}</h3>
  <div class="price">${p.price} جنيه</div>
  <button onclick="add(${i})">أضف للسلة</button></div>`;
});

function add(i){ 
    cart.push(products[i]); 
    update(); 
}

function removeItem(i){ 
    cart.splice(i,1); 
    update(); 
}

function update(){
 document.getElementById('count').innerText = cart.length;
 let t=0, txt="";
 cart.forEach((p,i)=>{ 
     t+=p.price; 
     txt+=`<div>
      <span>${p.name} - ${p.price} ج</span>
      <button class="remove" onclick="removeItem(${i})">حذف</button>
     </div>`
