<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BM_ENGINE | متجرك الرسمي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Cairo',sans-serif; background:#0f172a; color:#fff; padding-bottom:350px; background-image:radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 50%);}
header{background:#111827; border-bottom:2px solid #38bdf8; padding:25px 20px; text-align:center; position:sticky; top:0; z-index:100;}
header h1{font-size:40px; font-weight:900;} header h1 span{color:#38bdf8;}
header p{color:#94a3b8; margin-top:8px;}
.hero{background:#1e293b; padding:30px 20px; margin:25px 15px; border-radius:20px; border:1px solid #334155; text-align:center;}
.hero h2{color:#38bdf8; font-size:28px; margin-bottom:15px;}
.hero p{font-size:18px; margin:8px 0; font-weight:700;}
.products{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:25px; padding:20px 15px; max-width:1100px; margin:auto;}
.card{background:#1e293b; padding:15px; border-radius:20px; text-align:center; border:1px solid #334155;}
.card-img{width:100%; height:180px; border-radius:12px; margin-bottom:15px; background:linear-gradient(135deg,#0f172a,#1e3a8a,#0ea5e9); border:1px solid #38bdf8; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;}
.card-img .icon{font-size:55px;} .card-img .label{font-size:24px; font-weight:900;} .card-img .sub{font-size:13px; background:#38bdf8; color:#0f172a; padding:4px 12px; border-radius:20px; font-weight:900;}
.card h3{font-size:20px; margin-bottom:10px; min-height:50px; display:flex; align-items:center; justify-content:center;}
.price{color:#38bdf8; font-weight:900; font-size:26px; margin-bottom:15px;}
button{background:linear-gradient(135deg,#0ea5e9,#3b82f6); color:#fff; border:none; padding:14px; border-radius:12px; cursor:pointer; width:100%; font-size:16px; font-family:'Cairo',sans-serif; font-weight:700;}
#cart{position:fixed; bottom:10px; left:10px; right:10px; background:#111827; padding:20px; border-radius:20px; border:1px solid #38bdf8; max-height:330px; overflow-y:auto; z-index:1000;}
#cart h3{text-align:center; margin-bottom:15px;} #cart h3 span{color:#38bdf8;}
#items div{display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px; border-bottom:1px solid #334155; padding-bottom:8px; color:#cbd5e1;}
input{width:100%; padding:12px; margin-bottom:10px; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:10px; font-family:'Cairo',sans-serif;}
.remove{background:#334155; color:#ef4444; width:auto; padding:4px 10px; font-size:12px; border-radius:6px; border:1px solid #ef4444;}
.contact-btns{display:flex; gap:10px; margin-top:10px;}
.btn-wa{background:#25D366 !important;} .btn-tg{background:#0088cc !important;}
footer{text-align:center; padding:40px 20px; color:#475569;}
</style>
</head>
<body>
<header><h1>BM_<span>ENGINE</span></h1><p>متجرك الرسمي - جودة - سرعة - ثقة</p></header>
<div class="hero"><h2>🔥 متوفر عندنا 🔥</h2><p>كورس صنع ملفات ببجي</p><p>ملفات مدفوعة</p><p>ملفات مدفوعة بحقوقك</p></div>
<div class="products" id="products"></div>
<div id="cart"><h3>🛒 السلة: <span id="count">0</span> - الإجمالي: <span id="total">0</span> جنيه</h3><div id="items"></div><input id="name" placeholder="اسمك"><input id="phone" placeholder="رقم موبايلك"><div class="contact-btns"><button onclick="orderWhatsApp()" class="btn-wa">واتساب ✅</button><button onclick="orderTelegram()" class="btn-tg">تليجرام ✈️</button></div><p style="text-align:center; color:#94a3b8; font-size:14px; margin-top:10px;">تليجرام: @BM_ENGINE</p></div>
<footer>© 2026 BM_ENGINE - جميع الحقوق محفوظة</footer>
<script>
const products = [
 { name:"كورس صنع ملفات ببجي", price:350, icon:"🎓", label:"الكورسات المدفوعة", tag:"كورس مدفوع" },
 { name:"ملفات مدفوعة (عروض)", price:200, icon:"📁", label:"الملفات المدفوعة", tag:"ملف مدفوع" },
 { name:"ملفات مدفوعة بحقوقك", price:200, icon:"💎", label:"الملفات المدفوعة", tag:"بحقوقك" },
];
const telegramUsername = "BM_ENGINE";
const whatsappNumber = "201286473176";
let cart = [];
const box = document.getElementById('products');
products.forEach((p,i)=>{
 box.innerHTML += '<div class="card"><div class="card-img"><div class="icon">'+p.icon+'</div><div class="label">'+p.label+'</div><div class="sub">'+p.tag+'</div></div><h3>'+p.name+'</h3><div class="price">'+p.price+' جنيه</div><button onclick="add('+i+')">أضف للسلة</button></div>';
});
function add(i){ cart.push(products[i]); update(); }
function removeItem(i){ cart.splice(i,1); update(); }
function update(){
 document.getElementById('count').innerText = cart.length;
 let t=0, txt="";
 cart.forEach((p,i)=>{ t+=p.price; txt+='<div><span>'+p.name+' - '+p.price+' ج</span><button class="remove" onclick="removeItem('+i+')">حذف</button></div>'; });
 document.getElementById('total').innerText = t;
 document.getElementById('items').innerHTML = txt;
}
function getOrderMessage(){
 let name=document.getElementById('name').value.trim();
 let phone=document.getElementById('phone').value.trim();
 let msg = "طلب جديد من BM_ENGINE\nالاسم: "+name+"\nالموبايل: "+phone+"\n";
 cart.forEach(p=>{ msg += "- "+p.name+" : "+p.price+" جنيه\n"; });
 msg += "الإجمالي: "+document.getElementById('total').innerText+" جنيه";
 return msg;
}
function checkInputs(){
 let name=document.getElementById('name').value.trim();
 let phone=document.getElementById('phone').value.trim();
 if(cart.length===0){ alert("السلة فاضية، أضف منتجات الأول"); return false; }
 if(!name || !phone){ alert("اكتب اسمك ورقم موبايلك"); return false; }
 return true;
}
function orderWhatsApp(){ if(!checkInputs()) return; window.open("https://wa.me/"+whatsappNumber+"?text="+encodeURIComponent(getOrderMessage())); }
function orderTelegram(){
 if(!checkInputs()) return;
 window.open("https://t.me/"+telegramUsername);
 navigator.clipboard.writeText(getOrderMessage()).then(()=>{ alert("تم فتح تليجرام! اعمل لصق للرسالة"); });
}
</script>
</body>
</html>
