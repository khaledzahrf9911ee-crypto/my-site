<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BM_ENGINE | متجرك الرسمي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #0f172a;
      color: #fff;
      padding-bottom: 350px;
      background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 50%);
    }
    header {
      background: #111827;
      border-bottom: 2px solid #38bdf8;
      padding: 25px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 40px; font-weight: 900; }
    header h1 span { color: #38bdf8; }
    header p { color: #94a3b8; margin-top: 8px; }
    .hero {
      background: #1e293b;
      padding: 30px 20px;
      margin: 25px 15px;
      border-radius: 20px;
      border: 1px solid #334155;
      text-align: center;
    }
    .hero h2 { color: #38bdf8; font-size: 28px; margin-bottom: 15px; }
    .hero p { font-size: 18px; margin: 8px 0; font-weight: 700; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      padding: 20px 15px;
      max-width: 1100px;
      margin: auto;
    }
    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid #334155;
    }
    .card-img {
      width: 100%;
      height: 180px;
      border-radius: 12px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #0f172a, #1e3a8a, #0ea5e9);
      border: 1px solid #38bdf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .card-img .icon { font-size: 55px; }
    .card-img .label { font-size: 24px; font-weight: 900; }
    .card-img .sub {
      font-size: 13px;
      background: #38bdf8;
      color: #0f172a;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 900;
    }
    .card h3 {
      font-size: 20px;
      margin-bottom: 10px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
